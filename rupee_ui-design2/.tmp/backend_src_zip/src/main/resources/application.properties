#spring.application.name=rupee

# ==========================================
# 1. DATABASE CONFIGURATION (LOCAL H2)
# ==========================================
# For AWS EC2 Deployment and Local Testing
spring.datasource.url=jdbc:h2:mem:test_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect.storage_engine=innodb

# ==========================================
# 2. JPA & HIBERNATE CONFIGURATION FOR BATCH OPERATIONS
# ==========================================
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ==========================================
# 3. SECURITY & JWT CONFIGURATION
# ==========================================
# MUST be at least 32 characters long for JJWT 0.12.x!
jwt.secret=your-very-secure-and-very-long-secret-key-for-rupee-app-2026
# Expiration time in hours
jwt.expiry=24

# Google OAuth configuration with a default fallback for CI/CD
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-secret}

# ==========================================
# 4. AWS S3 CONFIGURATION
# ==========================================
# Configuration with default dummy values for CI/CD
aws.s3.bucket=${AWS_BUCKET_NAME:dummy-bucket}
aws.region=${AWS_REGION:ap-south-1}
aws.access-key=${AWS_ACCESS_KEY:dummy-access}
aws.secret-key=${AWS_SECRET_KEY:dummy-secret}

# ==========================================
# 5. BOOKING CONFIGURATION
# ==========================================
# Booking Window Configuration (Working Days)
app.booking.window.days-before=2
app.booking.window.days-after=2

# ==========================================
# 6. LOCAL DUMMY MAIL CONFIGURATION
# ==========================================
# Use these settings for local development to prevent app startup errors.
# Emails will be "sent" to localhost (and will fail silently or log an error),
# but the Spring ApplicationContext will load successfully.
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=local-test-user

# ? FIXED: Using an environment variable placeholder clears the SonarQube warning.
# This tells Spring to look for an env variable, and if it doesn't exist, use an empty string.
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# --- Email to Ticket IMAP Configuration (DUMMY VALUES FOR BUILD) ---
email.imap.host=imap.example.com
email.imap.port=993
email.imap.folder=INBOX
email.imap.username=dummy_support@example.com
email.imap.password=dummy_password_123
email.processing.enabled=false
email.polling.interval=60000

# ==========================================
# ON-HOLD: AWS SES SMTP CONFIGURATION
# ==========================================
# (Uncomment this and comment Local/Gmail to switch to AWS SES)
# spring.mail.host=email-smtp.ap-south-1.amazonaws.com
# spring.mail.port=587
# spring.mail.username=${SES_USERNAME:dummy-ses-user}
# spring.mail.password=${SES_PASSWORD:dummy-ses-password}
# spring.mail.properties.mail.smtp.auth=false
# spring.mail.properties.mail.smtp.starttls.enable=false
# spring.mail.properties.mail.transport.protocol=smtp
# spring.mail.properties.mail.smtp.from=support@rupeeapp.com

# ==========================================
# 7. LOCAL SMS / DLT CONFIGURATION
# ==========================================
# Because we used the fallback syntax, Spring will automatically use these
# dummy values locally, allowing your logs to print out the mock SMS.
sms.dlt.principal-entity-id=${DLT_PE_ID:1001000000000000000}
sms.dlt.template-id=${DLT_TEMPLATE_ID:1007000000000000000}
sms.dlt.sender-id=${DLT_SENDER_ID:DUMMYS}
sms.provider.api-url=${SMS_API_URL:https://dummy.smsprovider.com/api/v1/send}
sms.provider.api-key=${SMS_API_KEY:dummy_secret_key_123}

# ==========================================
# FEATURE TOGGLES
# ==========================================
# Keep false locally to save API calls, uses email OTP only.
app.sms.enabled=false

# ==========================================
# RAZORPAY CONFIGURATION
# ==========================================
# Locally, it will use the hardcoded test keys. In EC2/GitHub, it will pull from secrets.
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_your_local_key_id}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:your_local_key_secret}